<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GROWTHX 課程報名系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; color: #1d1d1f; }
    .checkout-card { background: white; border-radius: 24px; padding: 40px; box-shadow: 0 12px 32px rgba(0,0,0,0.08); max-width: 600px; margin: 40px auto; }
    .form-control, .form-select { border-radius: 12px; padding: 14px; border: 1px solid #d2d2d7; background-color: #fcfcfc; }
    .form-control:focus, .form-select:focus { border-color: #0066cc; box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1); }
    .form-label { font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #434344; }
    .btn-brand { background-color: #1d1d1f; color: white; border-radius: 12px; padding: 16px; font-weight: 600; width: 100%; transition: 0.2s; }
    .btn-brand:hover { background-color: #434344; transform: translateY(-2px); }
    .price-box { background: rgba(0, 102, 204, 0.05); border: 2px dashed #0066cc; border-radius: 16px; padding: 20px; }
  </style>
</head>
<body>

<div class="container">
  <div class="checkout-card">
    <div class="text-center mb-5">
      <div class="mb-4">
        <img src="https://raw.githubusercontent.com/alwayslucky2hand-ops/growthx/main/202604_AI%E5%AD%B8%E9%99%A2growthx%E5%B2%B3logo.png" alt="GrowthX Logo" style="max-width: 200px; height: auto;">
      </div>
      <h2 class="fw-bold" id="courseTitle" style="letter-spacing: -1px;">載入課程資訊中...</h2>
      <p class="text-muted" id="courseSubtitle">請填寫以下資訊完成報名與繳費</p>
    </div>

    <form id="checkoutForm" onsubmit="submitOrder(event)">
      <div class="row mb-4">
        <div class="col-md-6 mb-3 mb-md-0">
          <label class="form-label text-muted">目前時間</label>
          <input type="text" id="sysTime" class="form-control text-muted" readonly style="background:#eee;">
        </div>
        <div class="col-md-6">
          <label class="form-label text-muted">推薦人代碼 (V.C Point)</label>
          <input type="text" id="refCode" class="form-control fw-bold text-primary" readonly style="background:#e6f2ff; border-color:#b3d4ff;">
        </div>
      </div>

      <hr class="mb-4" style="opacity: 0.1;">

      <div class="mb-3">
        <label class="form-label">公司名稱 / 單位姓名 <span class="text-danger">*</span></label>
        <input type="text" id="companyName" class="form-control" required>
      </div>
      
      <div class="row mb-3">
        <div class="col-md-6 mb-3 mb-md-0">
          <label class="form-label">聯繫人姓名 <span class="text-danger">*</span></label>
          <input type="text" id="contactName" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">專業別 / 職稱 <span class="text-danger">*</span></label>
          <input type="text" id="jobTitle" class="form-control" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6 mb-3 mb-md-0">
          <label class="form-label">聯繫電話 <span class="text-danger">*</span></label>
          <input type="tel" id="phone" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">聯繫 Email <span class="text-danger">*</span></label>
          <input type="email" id="email" class="form-control" required>
        </div>
      </div>

      <div class="mb-4 p-3 rounded" style="background:#fcfcfc; border:1px solid #eee;">
        <label class="form-label mb-2 d-block">是否需要開立發票？(外加 5% 營業稅)</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="invoiceOption" id="invNo" value="no" checked onchange="calculateTotal()">
          <label class="form-check-label" for="invNo">不需要 (未稅)</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="invoiceOption" id="invYes" value="yes" onchange="calculateTotal()">
          <label class="form-check-label" for="invYes">需要 (需填統編)</label>
        </div>
        <div id="taxIdWrapper" class="mt-3" style="display: none;">
          <label class="form-label">統一編號</label>
          <input type="text" id="taxId" class="form-control" placeholder="請輸入 8 碼統一編號" pattern="\d{8}">
        </div>
      </div>

      <hr class="mb-4" style="opacity: 0.1;">

      <div class="mb-3">
        <label class="form-label">選擇報名日期 <span class="text-danger">*</span></label>
        <select id="courseDate" class="form-select fw-bold" required>
          <option value="">載入可用日期中...</option>
        </select>
        <small class="text-muted mt-1" id="dateHint">系統自動屏蔽已滿班或已包班之日期。</small>
      </div>

      <div class="mb-4">
        <label class="form-label">報名人數 / 數量 <span class="text-danger">*</span></label>
        <input type="number" id="quantity" class="form-control fw-bold" value="1" min="1" max="10" required onchange="calculateTotal()">
      </div>

      <div class="price-box mb-4">
        <div class="d-flex justify-content-between mb-2 text-secondary">
          <span>課程單價 (未稅)</span>
          <span id="displayUnitPrice">$0</span>
        </div>
        <div class="d-flex justify-content-between mb-2 text-secondary">
          <span>稅金 (5%)</span>
          <span id="displayTax">$0</span>
        </div>
        <hr style="border-color: #0066cc; opacity:0.2;">
        <div class="d-flex justify-content-between align-items-end mt-2">
          <span class="fw-bold text-primary">總結帳金額</span>
          <h2 class="m-0 fw-bold text-primary" id="displayTotal">$0</h2>
        </div>
      </div>

      <button type="submit" class="btn-brand" id="btnSubmit">
        前往黑貓 PAY 付款 <i data-lucide="arrow-right" style="width:18px; margin-left:4px;"></i>
      </button>

    </form>
  </div>
</div>

<script>
  lucide.createIcons();
  
  // ⚠️ 這裡的 GAS URL 已經與我們後端基線完全對齊，您可以視需求更新為新版部署網址
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbx1IyvzO_Z47G8TnVzb5AoKRtui8AYjcj2Et07VpQQQcFl0K2U6Y-o-E-pwHJzxP6Pl/exec"; 
  
  // 雙棲環境探針 (偵測是否在 Google Apps Script 環境內執行)
  const isGAS = typeof google !== 'undefined' && google.script;
  
  // 解析 URL 參數 (僅保留推薦人，移除 plan 判斷)
  const urlParams = new URLSearchParams(window.location.search);
  const refCode = urlParams.get('ref') || '無';
  
  // 統一設定基礎課程參數：費用改為 9000
  let unitPrice = 9000;
  let maxQtyAllowed = 10;
  const coursePlan = 'basic'; // 固定傳送 basic 給後端

  // 時鐘顯示
  setInterval(() => {
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('sysTime').value = `${yyyy}/${mm}/${dd} - ${hh}:${min}:${ss}`;
  }, 1000);

  // 頁面初始化設定
  window.onload = async () => {
    document.getElementById('refCode').value = refCode;
    
    // 鎖定 UI 顯示為智能客服班
    document.getElementById('courseTitle').innerText = "基礎課程 - AI 智能客服班";
    document.getElementById('courseSubtitle').innerText = "09:00 - 16:30 | 10 人小班制";
    
    document.getElementById('quantity').setAttribute('max', maxQtyAllowed);
    calculateTotal();
    await fetchAvailableDates();
  };

  // 監聽發票選項
  document.querySelectorAll('input[name="invoiceOption"]').forEach(el => {
    el.addEventListener('change', function() {
      const taxInput = document.getElementById('taxIdWrapper');
      const taxIdField = document.getElementById('taxId');
      if (this.value === 'yes') {
        taxInput.style.display = 'block';
        taxIdField.required = true;
      } else {
        taxInput.style.display = 'none';
        taxIdField.required = false;
        taxIdField.value = '';
      }
      calculateTotal();
    });
  });

  // 數量檢查與計算金額
  function calculateTotal() {
    let qty = parseInt(document.getElementById('quantity').value) || 1;
    if (qty > maxQtyAllowed) {
       qty = maxQtyAllowed; 
       document.getElementById('quantity').value = qty;
       alert(`本班型最多允許 ${maxQtyAllowed} 人報名`);
    }

    const subtotal = unitPrice * qty;
    let tax = 0;
    if (document.getElementById('invYes').checked) {
      tax = Math.round(subtotal * 0.05);
    }
    
    const total = subtotal + tax;

    document.getElementById('displayUnitPrice').innerText = `$${unitPrice.toLocaleString()}`;
    document.getElementById('displayTax').innerText = `$${tax.toLocaleString()}`;
    document.getElementById('displayTotal').innerText = `$${total.toLocaleString()}`;
  }

  // 透過 API 獲取可用日期 (相容 Fetch 與 isGAS 雙棲架構)
  async function fetchAvailableDates() {
    const select = document.getElementById('courseDate');
    try {
      let dates = [];
      
      if (isGAS) {
         // 在 GAS 環境，留作未來直接透過 google.script.run 溝通的擴充空間
         // 目前為維持架構單純，統一走 fetch API Webhook 模式
      }

      const response = await fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "getAvailableCourseDates", plan: coursePlan })
      });
      const res = await response.json();
      
      if (res.status === 'success') {
        dates = res.data;
        select.innerHTML = '<option value="">請選擇報名日期...</option>';
        
        if (dates.length === 0) {
           select.innerHTML += '<option value="" disabled>目前無可用班次</option>';
           return;
        }

        dates.forEach(d => {
           let remaining = d.maxSeats - d.booked;
           let text = `${d.date} (剩餘 ${remaining} 名額)`;
           select.innerHTML += `<option value="${d.date}">${text}</option>`;
        });
      } else {
        select.innerHTML = '<option value="">載入失敗，請重新整理</option>';
      }
    } catch (err) {
      document.getElementById('courseDate').innerHTML = '<option value="">連線錯誤，請檢查網路</option>';
    }
  }

  // 送出表單到後端
  async function submitOrder(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerHTML = '建立訂單中...';

    // 取得前端算好的總金額
    let qty = parseInt(document.getElementById('quantity').value) || 1;
    let subtotal = unitPrice * qty;
    let tax = document.getElementById('invYes').checked ? Math.round(subtotal * 0.05) : 0;
    let total = subtotal + tax;

    const payload = {
      action: "createCourseOrder",
      plan: coursePlan, // 固定傳送 basic
      refCode: document.getElementById('refCode').value,
      companyName: document.getElementById('companyName').value,
      contactName: document.getElementById('contactName').value,
      jobTitle: document.getElementById('jobTitle').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      needsInvoice: document.getElementById('invYes').checked,
      taxId: document.getElementById('taxId').value,
      selectedDate: document.getElementById('courseDate').value,
      quantity: document.getElementById('quantity').value,
      totalAmount: total
    };

    try {
      const response = await fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const res = await response.json();
      
      if (res.status === 'success' && res.data.url) {
         alert(`訂單建立成功！單號：${res.data.orderId}\n金額：$${res.data.totalAmount.toLocaleString()}\n即將為您跳轉至黑貓 PAY 金流頁面...`);
         window.location.href = res.data.url; 
      } else {
         alert("建立訂單失敗：" + res.message);
         btn.disabled = false;
         btn.innerHTML = '前往黑貓 PAY 付款';
      }
    } catch (err) {
      alert("網路連線錯誤，請稍後再試。");
      btn.disabled = false;
      btn.innerHTML = '前往黑貓 PAY 付款';
    }
  }
</script>
</body>
</html>
